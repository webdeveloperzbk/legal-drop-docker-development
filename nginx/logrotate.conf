/var/www/packway/nginx/logs/*.log {
    daily
    maxsize 100M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    su packway packway
    create 0644 packway packway
    sharedscripts
    postrotate
        if [ "$(/usr/bin/docker inspect -f '{{.State.Running}}' packway-nginx-development 2>/dev/null)" = true ]; then
            /usr/bin/docker kill --signal=USR1 packway-nginx-development >/dev/null
        fi
    endscript
}
