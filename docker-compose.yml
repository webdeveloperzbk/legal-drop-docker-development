name: legal-drop

x-app: &app
  image: ghcr.io/webdeveloperzbk/legal-drop-prerelease:${APP_VERSION:?Set APP_VERSION to the built release tag}
  restart: unless-stopped
  stop_grace_period: 90s
  volumes:
    - app-release:/var/www/app

services:
  legal-drop-nginx:
    image: ghcr.io/webdeveloperzbk/legal-drop-nginx-development:1.31.6-alpine3.24
    container_name: legal-drop-nginx-development
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -T 3 -O /dev/null --no-check-certificate --header='Host: legal-drop.su' https://nginx.internal/up &&
          wget -q -T 3 -O /dev/null --no-check-certificate --header='Host: admin.legal-drop.su' https://nginx.internal/up
      interval: 15s
      timeout: 10s
      start_period: 15s
      retries: 5
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./nginx/ssl
        target: /etc/nginx/ssl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/logs
        target: /var/log/nginx
        bind:
          create_host_path: false
      # Only ACME HTTP-01 challenge files, not Laravel code or public assets.
      - type: bind
        source: ./nginx/acme
        target: /var/www/acme
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      legal-drop-api:
        condition: service_healthy
        restart: true
      legal-drop-reverb:
        condition: service_healthy
        restart: true
    networks:
      legal-drop:
        aliases: [nginx.internal]

  legal-drop-api:
    <<: *app
    container_name: legal-drop-development-api
    environment:
      START_ROADRUNNER: "true"
      START_REVERB: "false"
      START_QUEUE: "true"
      START_CRON: "true"
    depends_on:
      legal-drop-postgres:
        condition: service_healthy
        restart: true
      legal-drop-redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          rc-service laravel_queue status >/dev/null &&
          pgrep -f '^/usr/sbin/crond -f' >/dev/null &&
          php -d default_socket_timeout=2 -r '
          try {
            require "vendor/autoload.php";
            $$app = require "bootstrap/app.php";
            $$app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            Illuminate\Support\Facades\DB::select("SELECT 1");
            Illuminate\Support\Facades\Redis::connection()->ping();
            exit(@file_get_contents("http://api.internal:9000/up") === false ? 1 : 0);
          } catch (Throwable) { exit(1); }'
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      legal-drop:
        aliases: [api.internal]

  legal-drop-reverb:
    <<: *app
    container_name: legal-drop-development-reverb
    environment:
      START_ROADRUNNER: "false"
      START_REVERB: "true"
      START_QUEUE: "false"
      START_CRON: "false"
    depends_on:
      legal-drop-redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - >-
          foreach (["reverb.internal:8080", "redis.internal:6379"] as $$address) {
            $$socket = @stream_socket_client("tcp://".$$address, $$errno, $$error, 2);
            if ($$socket === false) { exit(1); }
            fclose($$socket);
          }
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      legal-drop:
        aliases: [reverb.internal]

  legal-drop-postgres:
    image: postgres:18-alpine
    container_name: legal-drop-development-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legaldrop
      POSTGRES_USER: legaldrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker_development/.env}
    volumes:
      # PostgreSQL 18: PGDATA=/var/lib/postgresql/18/docker.
      - type: bind
        source: ./postgres
        target: /var/lib/postgresql
    healthcheck:
      # Check the Docker network alias, not only the local Unix socket.
      test: ["CMD-SHELL", "pg_isready -h pg.internal -t 2 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      legal-drop:
        aliases: [pg.internal]

  legal-drop-redis:
    image: redis:8-alpine
    container_name: legal-drop-development-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - type: bind
        source: ./redis
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h redis.internal --raw ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      legal-drop:
        aliases: [redis.internal]

volumes:
  app-release:
    external: true
    name: legal-drop-drive-${APP_VERSION:?Set APP_VERSION to the built release tag}

networks:
  legal-drop:
    driver: bridge
    name: legal-drop
